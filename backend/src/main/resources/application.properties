server.port=8081
spring.application.name=revenue-recovery
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

spring.datasource.url=jdbc:postgresql://localhost:5434/ride_db?options=-c%20TimeZone=Asia%2FKolkata
spring.datasource.username=ride_user
spring.datasource.password=ride_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


resilience4j.circuitbreaker.instances.aiDecision.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.aiDecision.slidingWindowSize=5
resilience4j.circuitbreaker.instances.aiDecision.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.aiDecision.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiDecision.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.aiDecision.permittedNumberOfCallsInHalfOpenState=2

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}